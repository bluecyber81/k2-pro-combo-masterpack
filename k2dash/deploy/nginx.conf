worker_processes 1;
pid nginx.pid;
error_log stderr info;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_max_body_size 2g;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8090;
        server_name _;
        root /opt/k2dash-readonly/current;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location = /sw.js {
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/moonraker/ {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://192.168.178.74:7125/;
        }

        location = /api/printer-ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_buffering off;
            proxy_pass http://192.168.178.74:9999/;
        }

        # Older cached K2Dash builds connected every browser directly to the
        # fragile Creality signaling service. The current UI uses go2rtc.
        location = /api/printer-camera/call/webrtc_local {
            return 410;
        }

        location /api/printer-camera/ {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
            proxy_pass http://192.168.178.74:8000/;
        }

        location /api/go2rtc/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://192.168.178.74:1984/;
        }

        location /api/printer-upload/ {
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://192.168.178.74:80/;
        }
    }
}
